# =====================================================================
# Build and Push Image
# ---------------------------------------------------------------------
# 功能：push 到 main 分支或打 v* 标签时，使用仓库根目录的 Containerfile
#       构建 OCI 标准镜像，并推送到 ghcr.io/hinnyuu/opencode。
#
# 原理说明：Containerfile 与 Dockerfile 是同一种构建描述格式（仅文件名
#           不同）。这里用 Docker 官方 BuildKit 构建，产出的 OCI 镜像
#           可被 podman / docker / containerd 等任意运行时直接拉取运行。
#           这也是 GitHub 官方 GHCR 发布文档推荐的标准 action 组合。
# =====================================================================
name: Build and Push Image

on:
  push:
    branches: [main]    # main 每次推送 → 更新 :main / :sha-* / :latest
    tags: ['v*']        # 语义化版本标签（如 v1.2.3）→ 推送 :v1.2.3
  workflow_dispatch:    # 允许在 Actions 页面手动触发，便于调试与应急重建

# 全局变量：镜像仓库与镜像名。
# github.repository 展开为 "hinnyuu/opencode"，全小写，
# 天然符合 GHCR 命名规范（ghcr.io/OWNER/IMAGE，须小写）。
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# 并发控制：同一分支/标签产生新推送时，取消仍在运行的旧构建，节省配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub 托管 runner，预装 Docker + Buildx
    timeout-minutes: 30      # 防止异常任务无限挂起
    # 最小权限原则：
    #   contents: read  —— 检出代码所需
    #   packages: write —— GITHUB_TOKEN 据此获得向 ghcr.io 推送的权限
    permissions:
      contents: read
      packages: write

    steps:
      # 1) 检出代码（包含 Containerfile）
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2) 配置 Buildx（BuildKit CLI），启用层缓存等高级构建能力
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3) 登录 GHCR。使用内置 GITHUB_TOKEN，零长期密钥；
      #    首次推送会自动创建并关联 Packages 包到本仓库。
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4) 依据 Git 引用自动生成镜像 tag 与 OCI labels：
      #    tag 事件      → :v1.2.3（type=ref,event=tag）
      #    分支事件      → :main（type=ref,event=branch）
      #    每次构建      → :sha-<短哈希>（便于回滚定位）
      #    默认分支构建  → :latest（{{is_default_branch}} 为 metadata-action 内置变量）
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # 5) 构建并推送。
      #    file 指向 Containerfile —— BuildKit 不关心文件名，格式与 Dockerfile 通用。
      #    cache-from/cache-to 使用 GitHub Actions 缓存后端（type=gha），
      #    mode=max 缓存全部中间层，显著加速后续构建。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max